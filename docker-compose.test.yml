services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sahlbiz_test
      POSTGRES_USER: sahlbiz
      POSTGRES_PASSWORD: sahlbiz
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sahlbiz -d sahlbiz_test']
      interval: 5s
      timeout: 5s
      retries: 20
    ports: ['55432:5432']
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20
    ports: ['56379:6379']
  minio:
    image: minio/minio:latest
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ['59000:9000','59001:9001']
