name: Format Prisma Schema

on:
  workflow_dispatch:
  push:
    branches:
      - feat/sahlbiz-os-consolidation-v2

permissions:
  contents: write

jobs:
  format-prisma:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Format Prisma schema
        run: npx prisma format --schema packages/database/prisma/schema.prisma

      - name: Commit formatting changes
        run: |
          if git diff --quiet -- packages/database/prisma/schema.prisma; then
            echo "Prisma schema is already formatted."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/database/prisma/schema.prisma
          git commit -m "style(database): format Prisma schema"
          git push
