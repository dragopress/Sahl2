name: prisma-deploy

on:
  push:

concurrency:
  group: prisma-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  deploy:
    if: github.event_name == 'push' && github.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Pin npm
        run: npm install --global npm@10.9.9
      - name: Regenerate and persist Bun lockfile
        run: |
          bun install --lockfile-only
          if ! git diff --quiet -- bun.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add bun.lock
            git commit -m "fix(ci): regenerate Bun lockfile"
            git push
          fi
      - uses: prisma/cloud-deploy-action@v1
        with:
          module: module.mjs
          build-command: bun run build
          # Keep Prisma 8 isolated to the Composer deploy CLI. The application
          # database workspace owns Prisma 6.19.3 for ORM/client generation.
          prisma-version: 8.0.0-rc.15
