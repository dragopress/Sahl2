name: SahlBiz CI/CD

on:
  push:
    branches: [main, develop]
    tags:
      - 'v*-rc.*'
  pull_request:
  workflow_dispatch:
    inputs:
      rebuild_initial_migration:
        description: Generate and verify a fresh initial Prisma migration
        required: true
        default: false
        type: boolean
      deploy_production:
        description: Run production Prisma migrations after CI
        required: true
        default: false
        type: boolean

concurrency:
  group: sahlbiz-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 22
  DATABASE_URL: postgresql://sahlbiz:sahlbiz@localhost:5432/sahlbiz?schema=public
  DIRECT_URL: postgresql://sahlbiz:sahlbiz@localhost:5432/sahlbiz?schema=public
  REDIS_URL: redis://localhost:6379
  NODE_ENV: test
  CORS_ORIGINS: http://localhost:3000
  TRUST_PROXY: 'false'
  PORT: '3001'
  E2E_BASE_URL: http://127.0.0.1:3001/api/v1

jobs:
  quality:
    name: Validate, test, build and E2E
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sahlbiz
          POSTGRES_USER: sahlbiz
          POSTGRES_PASSWORD: sahlbiz
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sahlbiz -d sahlbiz"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate repository
        run: npm run validate
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Verify Prisma migration history
        run: |
          npm run db:migrate:deploy
          npx prisma migrate status --schema=packages/database/prisma/schema.prisma
      - name: Verify database matches Prisma schema
        working-directory: packages/database
        run: |
          npx prisma migrate diff \
            --from-url "$DATABASE_URL" \
            --to-schema-datamodel prisma/schema.prisma \
            --exit-code
      - name: Typecheck API
        run: npm run typecheck -w @sahlbiz/api
      - name: Typecheck web
        run: npm run typecheck -w @sahlbiz/web
      - name: Unit tests
        run: npm test
      - name: Build storage
        run: npm run build -w @sahlbiz/storage
      - name: Build API
        run: npm run build -w @sahlbiz/api
      - name: Build web
        run: npm run build -w @sahlbiz/web
      - name: Start API
        run: |
          npm run start -w @sahlbiz/api > /tmp/sahlbiz-api.log 2>&1 &
          echo $! > /tmp/sahlbiz-api.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3001/api/v1/health/live; then exit 0; fi
            sleep 2
          done
          cat /tmp/sahlbiz-api.log
          exit 1
      - name: End-to-end tests
        run: npm run e2e
      - name: Upload API log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-log
          path: /tmp/sahlbiz-api.log

  rebuild-initial-migration:
    name: Rebuild and verify initial Prisma migration
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.rebuild_initial_migration }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sahlbiz
          POSTGRES_USER: sahlbiz
          POSTGRES_PASSWORD: sahlbiz
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sahlbiz -d sahlbiz"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prisma validate --schema=packages/database/prisma/schema.prisma
      - name: Generate migration
        working-directory: packages/database
        run: |
          rm -rf prisma/migrations
          mkdir -p prisma/migrations/00000000000000_init
          npx prisma migrate diff \
            --from-empty \
            --to-schema-datamodel prisma/schema.prisma \
            --script > prisma/migrations/00000000000000_init/migration.sql
      - name: Verify migration
        run: |
          test -s packages/database/prisma/migrations/00000000000000_init/migration.sql
          test "$(find packages/database/prisma/migrations -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 1
          grep -qE '^CREATE TABLE|^CREATE TYPE|^CREATE SEQUENCE|^CREATE SCHEMA' packages/database/prisma/migrations/00000000000000_init/migration.sql
          git diff --check
      - name: Apply migration
        run: npm run db:migrate:deploy
      - name: Verify schema parity
        working-directory: packages/database
        run: |
          npx prisma migrate status --schema=prisma/schema.prisma
          npx prisma migrate diff \
            --from-url "$DATABASE_URL" \
            --to-schema-datamodel prisma/schema.prisma \
            --exit-code
      - name: Upload verified migration
        uses: actions/upload-artifact@v4
        with:
          name: verified-initial-prisma-migration
          path: packages/database/prisma/migrations/00000000000000_init/

  production-migrations:
    name: Deploy Prisma migrations to production
    needs: quality
    if: ${{ (github.ref == 'refs/heads/main' && github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && inputs.deploy_production) }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci --include=dev --no-audit --no-fund
      - name: Validate repository
        run: npm run validate
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Deploy migrations
        run: npm run db:migrate:deploy

  release-candidate:
    name: Release candidate checks
    if: ${{ startsWith(github.ref, 'refs/tags/v') && contains(github.ref, '-rc.') }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sahlbiz
          POSTGRES_USER: sahlbiz
          POSTGRES_PASSWORD: sahlbiz
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sahlbiz -d sahlbiz"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run validate
      - run: npm run release:check
      - run: npm run db:generate
      - run: npm run db:migrate:deploy
      - run: npm test
      - run: npm run typecheck -w @sahlbiz/api
      - run: npm run typecheck -w @sahlbiz/web
      - run: npm run build -w @sahlbiz/storage
      - run: npm run build -w @sahlbiz/api
      - run: npm run build -w @sahlbiz/web
      - run: npm run release:manifest
      - name: Upload release manifest
        uses: actions/upload-artifact@v4
        with:
          name: sahlbiz-release-manifest
          path: release/manifest.json
